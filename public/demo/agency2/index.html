<!doctype html>
<html lang="en">
  <head>
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verita — IGAMING CONSULTANCY</title>
    
    <meta name="description" content="Verita IGAMING CONSULTANTS — consultancy and delivery across UAE, LATAM and Cyprus.">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:title" content="Verita — IGAMING CONSULTANCY">
    <meta property="og:description" content="Verita IGAMING CONSULTANTS — consultancy and delivery across UAE, LATAM and Cyprus.">
    <link rel="icon" type="image/png" href="/demo/agency2/favicon.png">
    <script type="module" crossorigin src="/demo/agency2/assets/index-DJU1rbE0.js"></script>
    <link rel="stylesheet" crossorigin href="/demo/agency2/assets/index-Bie2yWpX.css">
    <style>
      #verita-sting{position:fixed;inset:0;z-index:9999;background:#000;transition:opacity 700ms ease}
      #verita-sting video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
      #verita-sting.is-leaving{opacity:0}
      #verita-sting-skip{position:absolute;right:24px;bottom:20px;display:inline-flex;align-items:center;
        min-height:44px;padding:0 12px;background:none;border:0;cursor:pointer;
        font-family:'Inter',system-ui,sans-serif;font-size:12px;text-transform:uppercase;
        letter-spacing:.18em;color:#8d8a84;transition:color .2s ease}
      #verita-sting-skip:hover{color:#e8c976}
      #verita-sting-skip:focus-visible{outline:1px solid #e8c976;outline-offset:4px;color:#e8c976}
      @media (prefers-reduced-motion: reduce){#verita-sting{display:none}}
    </style>
  </head>
  <body>
    
    <div id="root"></div>
    <script>
      (function () {
        var FORCE = /[?&]intro=1(&|$)/.test(location.search);
        var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var seen = false;
        try { seen = sessionStorage.getItem('verita-sting-seen') === '1'; } catch (e) {}
        if (reduced || (seen && !FORCE)) return;
        try { sessionStorage.setItem('verita-sting-seen', '1'); } catch (e) {}

        var base = '/demo/agency2/assets/';
        var wrap = document.createElement('div');
        wrap.id = 'verita-sting';
        wrap.innerHTML =
          '<video muted playsinline autoplay preload="auto" disablePictureInPicture ' +
          'poster="' + base + 'verita-sting-poster.png">' +
          '<source src="' + base + 'verita-sting.mp4" type="video/mp4">' +
          '<source src="' + base + 'verita-sting.webm" type="video/webm">' +
          '</video>' +
          '<button id="verita-sting-skip" type="button">Skip</button>';
        document.body.appendChild(wrap);

        var video = wrap.querySelector('video');
        var prevOverflow = document.documentElement.style.overflow;
        document.documentElement.style.overflow = 'hidden';
        var done = false;

        function end(fade) {
          if (done) return;
          done = true;
          clearTimeout(guard);
          document.removeEventListener('keydown', onKey);
          document.documentElement.style.overflow = prevOverflow;
          if (!fade) { wrap.remove(); return; }
          wrap.classList.add('is-leaving');
          setTimeout(function () { wrap.remove(); }, 750);
        }

        function onKey(e) { if (e.key === 'Escape') end(true); }
        document.addEventListener('keydown', onKey);
        wrap.querySelector('#verita-sting-skip').addEventListener('click', function () { end(true); });
        video.addEventListener('ended', function () { end(true); });
        video.addEventListener('error', function () { end(false); });

        var guard = setTimeout(function () { if (video.readyState < 3) end(false); }, 2500);
        video.addEventListener('canplay', function () { clearTimeout(guard); });

        var p = video.play();
        if (p && typeof p.catch === 'function') { p.catch(function () { end(false); }); }
      })();
    </script>
  </body>
</html>

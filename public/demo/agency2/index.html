<!doctype html>
<html lang="en">
  <head>
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verita — IGAMING CONSULTANCY</title>
    
    <meta name="description" content="Verita IGAMING CONSULTANTS — consultancy and delivery across UAE, LATAM and Cyprus.">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:title" content="Verita — IGAMING CONSULTANCY">
    <meta property="og:description" content="Verita IGAMING CONSULTANTS — consultancy and delivery across UAE, LATAM and Cyprus.">
    <link rel="icon" type="image/png" href="/demo/agency2/favicon.png">
    <script type="module" crossorigin src="/demo/agency2/assets/index-DJU1rbE0.js"></script>
    <link rel="stylesheet" crossorigin href="/demo/agency2/assets/index-Bie2yWpX.css">
    <style>
      #verita-sting{position:fixed;inset:0;z-index:9999;background:#000;transition:opacity 700ms ease;
        will-change:opacity;transform:translateZ(0);backface-visibility:hidden}
      #verita-sting video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#000;
        transform:translateZ(0)}
      #verita-sting.is-leaving{opacity:0;pointer-events:none}
      #verita-sting-skip{position:absolute;right:20px;bottom:20px;min-height:44px;padding:0 14px;cursor:pointer;
        background:transparent;border:0;color:#8d8a84;font-family:'Inter',system-ui,sans-serif;font-size:12px;
        text-transform:uppercase;letter-spacing:.18em;transition:color .25s ease}
      #verita-sting-skip:hover{color:#e8c976}
      #verita-sting-skip:focus-visible{outline:1px solid #e8c976;outline-offset:4px;color:#e8c976}
      #verita-sting-cta{position:absolute;left:0;right:0;bottom:8%;display:flex;gap:18px;justify-content:center;
        opacity:0;pointer-events:none;transition:opacity 500ms ease}
      #verita-sting-cta.is-on{opacity:1;pointer-events:auto}
      #verita-sting-cta button{min-width:150px;min-height:46px;padding:0 26px;cursor:pointer;background:transparent;
        border:1px solid rgba(201,162,74,.55);color:#e8c976;font-family:'Inter',system-ui,sans-serif;font-size:12px;
        text-transform:uppercase;letter-spacing:.24em;transition:background .25s ease,border-color .25s ease,color .25s ease}
      #verita-sting-cta button:hover{background:rgba(201,162,74,.12);border-color:#e8c976}
      #verita-sting-cta button:focus-visible{outline:1px solid #e8c976;outline-offset:4px}
    </style>
  </head>
  <body>
    
    <div id="root"></div>
    <script>
      (function () {
        var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) return;

        var base = '/demo/agency2/assets/';
        var wrap = document.createElement('div');
        wrap.id = 'verita-sting';
        wrap.setAttribute('role', 'dialog');
        wrap.setAttribute('aria-label', 'Verita intro');
        wrap.innerHTML =
          '<video muted playsinline autoplay preload="auto" disablePictureInPicture ' +
          'poster="' + base + 'verita-sting-poster.png">' +
          '<source src="' + base + 'verita-sting.mp4" type="video/mp4">' +
          '<source src="' + base + 'verita-sting.webm" type="video/webm">' +
          '</video>' +
          '<button id="verita-sting-skip" type="button">Skip</button>' +
          '<div id="verita-sting-cta">' +
          '<button id="verita-sting-enter" type="button">Enter</button>' +
          '<button id="verita-sting-play" type="button">Play</button>' +
          '</div>';
        document.body.appendChild(wrap);

        var video = wrap.querySelector('video');
        var skipBtn = wrap.querySelector('#verita-sting-skip');
        var cta = wrap.querySelector('#verita-sting-cta');
        var enterBtn = wrap.querySelector('#verita-sting-enter');
        var playBtn = wrap.querySelector('#verita-sting-play');
        var lastFocus = document.activeElement;
        var prevOverflow = document.documentElement.style.overflow;
        document.documentElement.style.overflow = 'hidden';
        var done = false;
        var guard = null;

        function finish() {
          if (done) return;
          done = true;
          clearTimeout(guard);
          document.removeEventListener('keydown', onKey);
          document.documentElement.style.overflow = prevOverflow;
          wrap.classList.add('is-leaving');
          setTimeout(function () {
            wrap.remove();
            if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
          }, 800);
        }

        function onKey(e) {
          if (e.key === 'Escape') finish();
        }

        function showCta() { cta.classList.add('is-on'); try { enterBtn.focus(); } catch (e) {} }

        document.addEventListener('keydown', onKey);
        skipBtn.addEventListener('click', finish);
        enterBtn.addEventListener('click', finish);
        playBtn.addEventListener('click', function () {
          cta.classList.remove('is-on');
          try { video.currentTime = 0; } catch (e) {}
          var pr = video.play();
          if (pr && typeof pr.catch === 'function') { pr.catch(showCta); }
        });
        video.addEventListener('ended', showCta);
        video.addEventListener('error', showCta);
        video.addEventListener('canplay', function () { clearTimeout(guard); });
        video.addEventListener('canplaythrough', function () { clearTimeout(guard); });

        guard = setTimeout(function () { if (video.readyState < 3) finish(); }, 2500);
        var p = video.play();
        if (p && typeof p.catch === 'function') { p.catch(function () { finish(); }); }
      })();
    </script>
  </body>
</html>
